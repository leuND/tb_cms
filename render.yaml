services:
  - type: web
    name: tb-cms
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt && python tools/siapkan_demo.py
    startCommand: python tools/start_production.py
    healthCheckPath: /ringkasan
    disk:
      name: tb-cms-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: SECRET_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: TBCMS_DB
        value: /var/data/tb_cms.sqlite
      - key: TBCMS_MASUK
        value: /var/data/masuk
